---
- name: Fetch TLS material from Key Vault (control node only)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: nats-cert

- name: Install and configure NATS servers
  hosts: nats_servers
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: nats-server
